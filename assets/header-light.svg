<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Santos Enmanuel Manosalva Aceros — Ingenieria de Sistemas, IA y Datos">
  <title>Santos Enmanuel Manosalva Aceros</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7">
        <animate attributeName="stop-color"
          values="#0284c7;#7c3aed;#1d4ed8;#0284c7" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#7c3aed">
        <animate attributeName="stop-color"
          values="#7c3aed;#0284c7;#15803d;#7c3aed" dur="9s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-opacity="0.6" />
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" />
    </filter>

    <clipPath id="frame">
      <rect width="1200" height="340" rx="18" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)" />
    <rect width="1200" height="340" fill="url(#grid)" />
    <ellipse cx="250" cy="120" rx="420" ry="260" fill="url(#halo)" />
    <ellipse cx="980" cy="290" rx="360" ry="220" fill="url(#halo)" opacity="0.7" />

    <g fill="none" stroke-linecap="round">
      <path d="M-40 250 C 160 250, 200 168, 380 168 S 620 96, 820 96 S 1080 62, 1260 62"
        stroke="#0284c7" stroke-width="2" stroke-opacity="0.5"
        stroke-dasharray="18 1400" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" from="0" to="-1418" dur="6s" repeatCount="indefinite" />
      </path>
      <path d="M-40 300 C 200 300, 280 226, 500 226 S 760 178, 1000 178 S 1180 150, 1260 150"
        stroke="#7c3aed" stroke-width="2" stroke-opacity="0.45"
        stroke-dasharray="14 1400" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" from="0" to="-1414" dur="7.5s" begin="1.1s" repeatCount="indefinite" />
      </path>
      <path d="M-40 196 C 180 196, 240 128, 460 128 S 700 52, 940 52 S 1180 30, 1260 30"
        stroke="#15803d" stroke-width="1.6" stroke-opacity="0.35"
        stroke-dasharray="10 1400" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" from="0" to="-1410" dur="9s" begin="2.4s" repeatCount="indefinite" />
      </path>
    </g>

    <g>
      <circle cx="380" cy="168" r="3.5" fill="#0284c7" filter="url(#soft)">
        <animate attributeName="r" values="3.5;6.5;3.5" dur="3.2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.9;0.35;0.9" dur="3.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="820" cy="96" r="3" fill="#7c3aed" filter="url(#soft)">
        <animate attributeName="r" values="3;6;3" dur="4.1s" begin="0.6s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.85;0.3;0.85" dur="4.1s" begin="0.6s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- nucleo orbital: sistema en movimiento -->
    <g transform="translate(1006 170)">
      <g fill="none" stroke-width="1.2">
        <circle r="58" stroke="#0284c7" stroke-opacity="0.4" stroke-dasharray="4 9">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite" />
        </circle>
        <circle r="92" stroke="#7c3aed" stroke-opacity="0.3" stroke-dasharray="2 12">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="38s" repeatCount="indefinite" />
        </circle>
        <circle r="126" stroke="#1d4ed8" stroke-opacity="0.18" stroke-dasharray="1 16">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="55s" repeatCount="indefinite" />
        </circle>
      </g>
      <circle r="6.5" fill="#0284c7" filter="url(#soft)">
        <animate attributeName="r" values="6.5;11;6.5" dur="3.4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.95;0.5;0.95" dur="3.4s" repeatCount="indefinite" />
      </circle>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite" />
        <circle cx="58" cy="0" r="3.2" fill="#0f172a" opacity="0.7" />
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="19s" repeatCount="indefinite" />
        <circle cx="92" cy="0" r="2.6" fill="#7c3aed" opacity="0.8" />
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="240" to="-120" dur="27s" repeatCount="indefinite" />
        <circle cx="126" cy="0" r="2.2" fill="#15803d" opacity="0.7" />
      </g>
    </g>

    <rect x="-360" y="0" width="360" height="340" fill="url(#beam)">
      <animate attributeName="x" from="-360" to="1200" dur="7s" repeatCount="indefinite" />
    </rect>

    <g transform="translate(72 0)">
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.15s" fill="freeze" />
        <text x="0" y="112" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace"
          font-size="15" letter-spacing="5.5" fill="#0284c7">ENGINEERING INTELLIGENCE INTO REALITY</text>
      </g>

      <g opacity="0" transform="translate(0 14)">
        <animate attributeName="opacity" from="0" to="1" dur="1.1s" begin="0.45s" fill="freeze" />
        <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0"
          dur="1.1s" begin="0.45s" fill="freeze" />
        <text x="0" y="186" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif"
          font-size="62" font-weight="700" letter-spacing="-1.4" fill="url(#name)">Santos Enmanuel</text>
        <text x="497" y="186" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif"
          font-size="25" font-weight="400" letter-spacing="3.4" fill="#94a3b8">MANOSALVA ACEROS</text>
      </g>

      <g opacity="0" transform="translate(0 14)">
        <animate attributeName="opacity" from="0" to="1" dur="1.1s" begin="0.75s" fill="freeze" />
        <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0"
          dur="1.1s" begin="0.75s" fill="freeze" />
        <text x="0" y="234" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif"
          font-size="23" font-weight="500" letter-spacing="0.2" fill="#475569">Ingeniero de Sistemas e Inform&#225;tica &#183; Desarrollador de Software</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.05s" fill="freeze" />
        <text x="0" y="272" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace"
          font-size="14.5" letter-spacing="1.6" fill="#64748b">Software &#183; Inteligencia Artificial &#183; Datos &#8212; Bucaramanga, Colombia</text>
      </g>

      <rect x="-2" y="126" width="0" height="3" rx="1.5" fill="url(#rule)">
        <animate attributeName="width" from="0" to="470" dur="1.3s" begin="0.55s" fill="freeze" />
      </rect>
    </g>

    <rect x="792" y="254" width="11" height="21" fill="#0284c7" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" dur="1.25s" begin="1.4s" repeatCount="indefinite" />
    </rect>

    <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#cbd5e1" stroke-width="1" />
  </g>
</svg>
